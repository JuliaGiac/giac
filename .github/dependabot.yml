# Keeps pinned dependencies current.
#
# Nothing watched them before this file: CompatHelper, where it runs, looks
# at Julia `[compat]` bounds and never at workflows, so the pinned actions
# drift silently until a runner image change breaks them.
#
# One PR per dependency rather than a combined bump, so a failure is
# attributable to the thing that caused it. That matters most across a
# major: a bot updates the version string, never the configuration the new
# major expects.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    # The workflows live on `dev`, not on the default branch: this
    # repository's own description says "use dev branch to see latest
    # developments". Dependabot reads its config from the default branch but
    # fetches the manifests it updates from `target-branch`, and without this
    # it found no workflow at all and aborted the job:
    #   ERROR Error during file fetching; aborting: /action.yml or
    #   /.github/workflows/<...>
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    labels:
      - dependencies
