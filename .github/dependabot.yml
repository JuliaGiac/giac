# Keeps the GitHub Actions pinned in dev's CI current.
#
# Dependabot reads this file only from the default branch (`main`), but the
# workflows live on `dev`, the integration branch with the Meson build;
# `main` has none. Without `target-branch`, Dependabot looks for workflows
# on `main`, finds nothing and aborts every run ("/action.yml or
# /.github/workflows/<anything>.yml not found"), which is why the earlier
# config (#2) was reverted. `target-branch: dev` makes it scan `dev` and
# open its PRs against `dev`.
#
# Scope: Dependabot has no Meson ecosystem, so the C/C++ dependencies stay
# unwatched. This covers the GitHub Actions only (actions/checkout,
# msys2/setup-msys2, actions/upload-artifact).
#
# One PR per action rather than a combined bump, so a failure is
# attributable to the action that caused it. That matters most across a
# major: a bot updates the version string, never the configuration the new
# major expects.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
