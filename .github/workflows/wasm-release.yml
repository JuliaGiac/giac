name: giac-wasm release

# Pushing a tag giac-wasm-vX.Y.Z (X.Y.Z = npm/package.json's version) builds
# and tests giac-wasm, then publishes a GitHub Release with
# giac-wasm-X.Y.Z.tgz (installable without the npm registry:
# `npm install <its URL>`) and giac-wasm-X.Y.Z.zip (to download or serve).
# JuliaGiac/giac-wasm serves each release on its GitHub Pages.
# Publishing to the npm registry stays a manual step (npm publish).
on:
  push:
    tags: ['giac-wasm-v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      EMSDK_VERSION: 7.0.1
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag against npm/package.json
        run: |
          version="$(node -p "require('./npm/package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "giac-wasm-v${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match npm/package.json version ${version}" >&2
            exit 1
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build pkg-config zip

      - uses: mymindstorm/setup-emsdk@v16
        with:
          version: ${{ env.EMSDK_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Build
        run: npm/scripts/build.sh

      - name: Test
        working-directory: npm
        run: node --test test/*.test.mjs

      - name: Pack
        working-directory: npm
        run: |
          npm pack
          scripts/pack-zip.sh
          sha256sum "giac-wasm-${VERSION}.tgz" "giac-wasm-${VERSION}.zip" > SHA256SUMS

      - name: Publish the GitHub Release
        working-directory: npm
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "giac-wasm-${VERSION}.tgz" "giac-wasm-${VERSION}.zip" SHA256SUMS \
            --title "giac-wasm ${VERSION}" \
            --notes "giac-wasm ${VERSION}, Giac compiled to WebAssembly (see npm/README.md and CHANGELOG.md).

          Without the npm registry: \`npm install https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/giac-wasm-${VERSION}.tgz\`.
          In a page, by URL: https://juliagiac.github.io/giac-wasm/${VERSION}/src/index.mjs (once JuliaGiac/giac-wasm has deployed it)."
