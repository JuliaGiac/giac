name: CI

# Changes to the web site alone (site/, pages.yml) do not touch the build.
on:
  push:
    branches: [main, dev, '0**']
    paths-ignore: ['site/**', '.github/workflows/pages.yml']
  # `dev` is the integration branch (the Meson build lives there), so pull
  # requests target it; without it here they got no checks at all.
  pull_request:
    branches: [main, dev]
    paths-ignore: ['site/**', '.github/workflows/pages.yml']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: Linux
          - os: macos-latest
            name: macOS
          - os: windows-latest
            name: Windows (MSYS2)

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      # ── Linux dependencies ──────────────────────────────────────────────
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build gcc g++ \
            libgmp-dev libmpfr-dev libreadline-dev \
            libpng-dev libcurl4-openssl-dev

      # ── macOS dependencies ─────────────────────────────────────────────
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install meson ninja gmp mpfr readline

      # ── Windows (MSYS2) dependencies ───────────────────────────────────
      - name: Setup MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-meson
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-gmp
            mingw-w64-x86_64-mpfr
            mingw-w64-x86_64-libpng
            mingw-w64-x86_64-curl
            mingw-w64-x86_64-gettext-runtime

      # ── Configure ──────────────────────────────────────────────────────
      - name: Configure (Linux/macOS)
        if: runner.os != 'Windows'
        run: meson setup builddir

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: meson setup builddir

      # ── Build ──────────────────────────────────────────────────────────
      - name: Build (Linux/macOS)
        if: runner.os != 'Windows'
        run: meson compile -C builddir

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: meson compile -C builddir

      # ── Unit tests ─────────────────────────────────────────────────────
      - name: Unit tests (Linux/macOS)
        if: runner.os != 'Windows'
        run: meson test -C builddir --suite unit --print-errorlogs

      - name: Unit tests (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: meson test -C builddir --suite unit --print-errorlogs

      # ── Integration tests ──────────────────────────────────────────────
      - name: Integration tests (Linux/macOS)
        if: runner.os != 'Windows'
        run: meson test -C builddir --suite check --print-errorlogs

      # Integration tests on Windows are skipped: the shell-based test
      # runner requires Unix tools (tail, grep, diff) that are not in
      # PATH when meson spawns test subprocesses under MSYS2.

      # ── Upload logs on failure ─────────────────────────────────────────
      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs-${{ matrix.os }}
          path: builddir/meson-logs/testlog.txt

  # giac-wasm, the npm package (npm/): libgiac compiled with Emscripten, then
  # the package's tests with Node.js and the tarball as an artifact
  wasm:
    name: WebAssembly (giac-wasm)
    runs-on: ubuntu-24.04
    env:
      EMSDK_VERSION: 7.0.1
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build pkg-config

      - uses: mymindstorm/setup-emsdk@v16
        with:
          version: ${{ env.EMSDK_VERSION }}
          actions-cache-folder: emsdk-cache

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # GMP and MPFR for wasm32 take minutes; they change only with the
      # script or the Emscripten version
      - name: Cache GMP and MPFR for wasm32
        uses: actions/cache@v6
        with:
          path: builddir-wasm-deps/prefix
          key: wasm-deps-${{ env.EMSDK_VERSION }}-${{ hashFiles('npm/scripts/build.sh') }}

      - name: Build
        run: npm/scripts/build.sh

      - name: Test
        working-directory: npm
        run: node --test test/*.test.mjs

      # giac-wasm/worker in Chromium, as a module Web Worker under a strict CSP
      - name: Test in Chromium
        working-directory: npm
        run: |
          npm install --no-save playwright@1
          npx playwright install --with-deps chromium
          node test/browser-worker.mjs

      - name: Pack
        working-directory: npm
        run: npm pack

      - uses: actions/upload-artifact@v7
        with:
          name: giac-wasm
          path: npm/giac-wasm-*.tgz
