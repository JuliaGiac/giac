# baseURL is overridden in CI by the URL GitHub Pages reports.
baseURL = "https://juliagiac.github.io/giac/"
title = "giac"
disableKinds = ["taxonomy", "term", "RSS", "sitemap"]

[params]
description = "The Giac computer algebra system, with a Meson build."

# Code is highlighted with CSS classes; static/syntax.css holds the light
# (github) and dark (github-dark) palettes, shared with juliagiac.github.io.
[markup.highlight]
noClasses = false

[menus]
  [[menus.main]]
    name = "Overview"
    pageRef = "/"
    weight = 1
  [[menus.main]]
    name = "Building"
    url = "https://github.com/JuliaGiac/giac/blob/dev/BUILDING.md"
    weight = 2
  [[menus.main]]
    name = "Repository"
    url = "https://github.com/JuliaGiac/giac/tree/dev"
    weight = 3
  [[menus.main]]
    name = "Upstream Giac"
    url = "https://www-fourier.univ-grenoble-alpes.fr/~parisse/giac.html"
    weight = 4
